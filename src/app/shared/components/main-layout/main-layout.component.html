<mat-sidenav-container class="sidenav-container">
  <!-- MENÚ LATERAL (ASIDE) -->
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">
      <h2>SMAI Helpdesk</h2>
    </div>
    
    <mat-nav-list>
      <a mat-list-item routerLink="/categories">
        <mat-icon matListItemIcon>help_outline</mat-icon>
        <span matListItemTitle>Solicitar Soporte</span>
      </a>
      <a mat-list-item routerLink="/tickets">
        <mat-icon matListItemIcon>confirmation_number</mat-icon>
        <span matListItemTitle>Mis Tickets</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <span>Sistema de Gestión de Soporte TI</span>
      <span class="spacer"></span>
      <button mat-button (click)="logout()">
        <mat-icon>logout</mat-icon> Salir
      </button>
    </mat-toolbar>

    <!-- AQUÍ SE RENDERIZAN LAS DEMÁS VISTAS -->
    <div class="content-padding">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

<mat-sidenav-container class="sidenav-container">
  <!-- MENÚ LATERAL (ASIDE) -->
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">
      <h2>Nombre Proyecto</h2>
    </div>
    
    <mat-nav-list>
      <a mat-list-item routerLink="enlace1">
        <span matListItemTitle>Enlace 1</span>
      </a>
      <a mat-list-item routerLink="enlace2">
        <span matListItemTitle>Enlace 2</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- CONTENIDO PRINCIPAL -->
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      <span>Sistema</span>
      <span class="spacer"></span>
      <button mat-button (click)="logout()">
        <mat-icon>logout</mat-icon> Salir
      </button>
    </mat-toolbar>

    <!-- AQUÍ SE RENDERIZAN LAS DEMÁS VISTAS -->
    <div class="content-padding">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>

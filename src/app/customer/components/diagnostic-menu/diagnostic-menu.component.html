<div class="menu-container">
  <h2 class="mat-headline-4 text-center">¿En qué área presenta inconvenientes?</h2>
  <p class="mat-body-1 text-center">Seleccione una categoría para iniciar el asistente de diagnóstico</p>

  <div class="cards-grid">
    <mat-card *ngFor="let cat of categorias" class="category-card" (click)="irAlArbol(cat.id)" matRipple>
      <mat-card-header>
        <mat-icon mat-card-avatar color="primary">{{ cat.icon }}</mat-icon>
        <mat-card-title>{{ cat.title }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ cat.desc }}</p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
